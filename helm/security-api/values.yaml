replicaCount: 3

# Namespace the chart's resources are rendered into.
# Setting it explicitly keeps scanners like Checkov from seeing "default".
namespace: app

image:
  repository: ghcr.io/ishikasharma05/security-api
  digest: "sha256:15cb75bf40c2b1435565ecd0ffa2e51da6eb7d3a2ba03d75fb15cb9783b535df"
  pullPolicy: Always

serviceAccount:
  create: false
  name: security-api

containerPort: 8000

service:
  type: NodePort
  port: 80
  nodePort: 30080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }