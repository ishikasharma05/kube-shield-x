replicaCount: 2

image:
  repository: kubeshield/security-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: security-api

containerPort: 8000

service:
  type: NodePort
  port: 80
  nodePort: 30080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }
