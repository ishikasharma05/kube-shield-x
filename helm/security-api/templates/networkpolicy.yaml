apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "security-api.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "security-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "security-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  # No egress rules: all outbound traffic is denied.
  # The app makes no outbound calls; kubelet probes are not affected.
