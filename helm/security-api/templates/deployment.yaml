apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "security-api.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "security-api.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Image tag pinned for now; digest pinning follows once images are published to GHCR"
    checkov.io/skip2: "CKV_K8S_15=Images are loaded into Kind locally; Always pull breaks local dev until a registry is used"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "security-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "security-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "security-api.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
