apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ishikasharma05/kube-shield-x.git
    targetRevision: main
    path: helm/security-api
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
