apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-api
  namespace: app
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-api-reader
  namespace: app
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-api-reader
  namespace: app
subjects:
  - kind: ServiceAccount
    name: security-api
    namespace: app
roleRef:
  kind: Role
  name: security-api-reader
  apiGroup: rbac.authorization.k8s.io