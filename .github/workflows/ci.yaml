name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/security-api/requirements.txt httpx pytest
      - run: pytest app/tests -v

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,helm,dockerfile
          soft_fail: false

  image-security:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kubeshield/security-api:ci app/security-api

      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kubeshield/security-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy report (all severities, for evidence)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kubeshield/security-api:ci
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: kubeshield/security-api:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: |
            trivy-report.txt
            sbom.spdx.json
